version: 8.0
objective: "maximum useful quality with minimum model/context spend"

orchestrator:
  model: gpt-5.6-terra
  effort: medium
  verbosity: low

roles:
  director: {model: gpt-5.6-sol, effort: high}
  narration: {model: gpt-5.6-terra, effort: medium}
  manim: {model: gpt-5.6-sol, effort: high}
  manim_hero: {model: gpt-6-astra, effort: high, activation: escalation_only}
  blender: {model: gpt-5.6-sol, effort: high}
  blender_hero: {model: gpt-6-astra, effort: high, activation: escalation_only}
  asset_library: {model: gpt-5.6-luna, effort: low}
  reviewer: {model: gpt-5.6-sol, effort: high}
  reviewer_deep: {model: gpt-6-astra, effort: high, activation: escalation_only}
  resolve: {model: gpt-5.6-terra, effort: medium}
  youtube: {model: gpt-5.6-luna, effort: low}
  paper_research: {model: gpt-5.6-sol, effort: high, activation: optional}
  paper_deep: {model: gpt-6-astra, effort: high, activation: escalation_only}

escalation:
  manim_hero:
    - flagship/core visual derivation where scene quality carries the episode
    - two failed normal Manim attempts
    - reviewer reports a high/blocker defect owned by Manim that is not a trivial patch
  blender_hero:
    - flagship/core 3D shot or complex camera/spatial choreography
    - two failed normal Blender attempts
    - reviewer reports a high/blocker defect owned by Blender that is not a trivial patch
  reviewer_deep:
    - blocker defect
    - root cause is ambiguous across Manim/Blender/Resolve/narration
    - first reviewer patch failed verification
  paper_deep:
    - dense math central to the explanation
    - conflicting primary sources or version ambiguity
    - benchmark/quantitative claim is central and consequential

limits:
  max_parallel_workers: 3
  default_review_passes: 1
  max_revision_passes: 2
  no_duplicate_worker_for_same_stage: true
  pass_compact_artifacts_not_full_history: true
