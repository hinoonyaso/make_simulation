name: AI trace reproducibility

on:
  push:
  pull_request:

jobs:
  ai-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate checked-in AI execution trace
        run: python scripts/validate_ai_trace.py pilots/v10_rag_poc/data/ai_trace.json
      - name: Test AI and V9 manifest trace routing
        run: python -m unittest discover -s tests -p 'test_ai_director_routing.py' -v
