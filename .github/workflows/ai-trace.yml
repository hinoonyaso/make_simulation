name: AI trace reproducibility

on:
  push:
  pull_request:

jobs:
  ai-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical test dependencies
        run: python -m pip install numpy mujoco==3.7.0 packaging==26.3
      - name: Install locked V12 execution groups for full CPU regressions
        run: |
          python scripts/export_v12_requirements.py --groups sim-math sim-can sim-motor --output "$RUNNER_TEMP/v12-requirements.txt"
          python -m pip install --no-deps --require-hashes --requirements "$RUNNER_TEMP/v12-requirements.txt"
      - name: Validate checked-in AI execution trace
        run: python scripts/validate_ai_trace.py pilots/v10_rag_poc/data/ai_trace.json
      - name: Validate checked-in V9-compatible RAG manifest
        run: python core/robotics-ai-visual-director-skill/templates/validate_visual_manifest.py pilots/v10_rag_poc/visual_manifest.json
      - name: Run all CPU regressions including V11.5 motion, time mapping and execution cache
        run: python -m unittest discover -s tests -v
      - name: Validate V11 capability routing and vendored robot asset
        run: |
          python scripts/inspect_capabilities.py --topic quantization
          python scripts/inspect_capabilities.py --topic self_attention
          python scripts/manage_assets.py search --category environment
          python scripts/manage_assets.py validate --asset blender.open_manipulator_x.v1
      - name: Check Python syntax and module import boundaries
        run: python -m compileall -q core/ai-mechanism core/mechanism core/visual-assets core/simulation scripts/produce_ai_video.py scripts/produce_video.py scripts/inspect_capabilities.py scripts/manage_assets.py pilots/v10_rag_poc pilots/v10_threejs_rag/scripts
      - name: Build trace-matched Three.js projection without browser rendering
        run: |
          projection="$(mktemp)"
          V10_AI_TRACE="$PWD/pilots/v10_rag_poc/data/ai_trace.json" V10_THREE_PROJECTION="$projection" python pilots/v10_threejs_rag/scripts/build_projection.py
