name: AI video integration (manual)

on:
  workflow_dispatch:

jobs:
  manim-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum
          python -m pip install numpy manim
      - name: Render and decode the trace-driven preview
        env:
          V10_MANIM_BIN: manim
        run: |
          output="$(mktemp -d)"
          python pilots/v10_rag_poc/build_video.py preview --trace pilots/v10_rag_poc/data/ai_trace.json --manifest pilots/v10_rag_poc/visual_manifest.json --output-dir "$output" --silent
      - name: Render and full-decode the V11 Attention smoke preview
        run: |
          output="$(mktemp -d)"
          python scripts/produce_video.py --topic self_attention --preview --output-dir "$output"

  threejs-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser and project packages
        working-directory: pilots/v10_threejs_rag
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run trace-projection browser smoke test
        working-directory: pilots/v10_threejs_rag
        run: npm run test:browser
