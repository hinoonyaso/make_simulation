name: PyBaMM battery education smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v14.2-battery.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'core/education/**'
      - 'core/education/blender_compat.py'
      - 'core/simulation_engines/battery/**'
      - 'core/robotics-ai-visual-director-skill/templates/validate_visual_manifest.py'
      - 'examples/education/battery_*.json'
      - 'pilots/v14_education/manim/battery_scene.py'
      - 'pilots/v14_education/blender/battery_scene.py'
      - 'assets/education/generated/shaft_coupling_spring_fastener_battery.blend'
      - 'scripts/produce_lesson.py'
      - 'scripts/run_battery_simulation.py'
      - 'scripts/validate_battery_result.py'
      - 'tests/test_sparse_render_plan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battery-simulation-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.3'
          enable-cache: true
      - name: Install Manim system requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum pkg-config libcairo2-dev libpango1.0-dev
      - name: Install locked solver and render dependencies
        run: uv sync --locked --group sim-battery --group sim-render --no-install-project
      - name: Run actual PyBaMM SPM and validate saved output
        run: |
          uv run --locked --no-sync python scripts/run_battery_simulation.py \
            --config examples/education/battery_spm_config.json \
            --output-dir "$RUNNER_TEMP/battery-solver" --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run --locked --no-sync python scripts/validate_battery_result.py "$RUNNER_TEMP/battery-solver"
      - name: Run real early-cutoff PyBaMM event case
        run: |
          uv run --locked --no-sync python scripts/run_battery_simulation.py \
            --config examples/education/battery_spm_early_termination_config.json \
            --output-dir "$RUNNER_TEMP/battery-solver-early" --run-id "event-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run --locked --no-sync python scripts/validate_battery_result.py "$RUNNER_TEMP/battery-solver-early"
          uv run --locked --no-sync python - "$RUNNER_TEMP/battery-solver-early/result.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          if result["termination_reason"] == "final time":
              raise SystemExit("expected the configured voltage cutoff event to end the run early")
          if result["actual_end_time_s"] >= result["requested_duration_s"]:
              raise SystemExit("early-cutoff run reached or exceeded its requested duration")
          if result["event_time_s"] != result["actual_end_time_s"]:
              raise SystemExit("saved PyBaMM event time differs from the final sample time")
          print(f"PASS: {result['termination_reason']} at {result['event_time_s']:.6f} s")
          PY
      - name: Validate Manim loader against actual early-cutoff result
        run: |
          uv run --locked --no-sync python - "$RUNNER_TEMP/battery-solver-early" <<'PY'
          import sys
          from pathlib import Path
          from core.simulation_engines.battery.result_validator import load_validated_result
          from core.simulation_engines.battery.manim_data import load_samples

          result_dir = Path(sys.argv[1])
          loaded = load_validated_result(result_dir)
          result = loaded["result"]
          if not result["termination_reason"].startswith("event:"):
              raise SystemExit("expected a real PyBaMM event-terminated result")
          context = {"solver_result": {
              "solver_id": result["solver_execution"]["solver_id"],
              "timeseries_file": "battery_timeseries.csv",
              "result_sha256": result["result_sha256"],
              "actual_end_time_s": result["actual_end_time_s"],
              "sample_count": result["sample_count"],
          }}
          samples = load_samples(context, result_dir / "renderer_context.json")
          if len(samples["time_s"]) != result["sample_count"]:
              raise SystemExit("Manim loaded a different number of samples than the validated PyBaMM result")
          print(f"PASS: Manim loaded {len(samples['time_s'])} event-result samples through {samples['time_s'][-1]:.12g} s")
          PY
      - name: Run battery contract regression tests
        run: uv run --locked --no-sync python -m unittest discover -s tests -p test_battery_simulation.py -v
      - name: Validate sparse render plan and FFmpeg composition fixtures
        run: uv run --locked --no-sync python -m unittest discover -s tests -p test_sparse_render_plan.py -v
      - name: Validate PyBaMM lesson plan without solver execution
        run: |
          uv run --locked --no-sync python scripts/produce_lesson.py \
            --spec examples/education/battery_spm_smoke.json --plan-only \
            --output-root "$RUNNER_TEMP/battery-plan" --run-id "plan-${GITHUB_RUN_ID}"
      - name: Render Manim graph from actual solver output
        env:
          V11_MANIM_BIN: manim
        run: |
          uv run --locked --no-sync python scripts/produce_lesson.py \
            --spec examples/education/battery_manim_smoke.json \
            --solver-result "$RUNNER_TEMP/battery-solver" --preview --manim-only \
            --output-root "$RUNNER_TEMP/battery-render" --run-id "manim-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Validate manifest trace, provenance and media
        run: |
          run_dir="$RUNNER_TEMP/battery-render/manim-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run --locked --no-sync python core/robotics-ai-visual-director-skill/templates/validate_visual_manifest.py \
            "$run_dir/visual_manifest.json" --require-media
          uv run --locked --no-sync python scripts/validate_delivery.py "$run_dir/preview.mp4" \
            --min-width 960 --min-height 540 --fps 30 --timeline "$run_dir/timeline.json" \
            --caption-timing "$run_dir/caption_timing.json" --full-decode
          uv run --locked --no-sync python - "$run_dir" <<'PY'
          import json, sys
          from pathlib import Path
          run = Path(sys.argv[1])
          report = json.loads((run / "production_report.json").read_text())
          provenance = json.loads((run / "renderer_provenance.json").read_text())
          manifest = json.loads((run / "visual_manifest.json").read_text())
          if report.get("solver_used") is not True or report.get("evidence_status", {}).get("status") != "RESULT_VALIDATED":
              raise SystemExit("production report does not prove a validated computed run")
          if provenance.get("solver_provenance", {}).get("run_id") != manifest["beats"][0]["solver_trace"]["run_id"]:
              raise SystemExit("manifest trace and renderer provenance run IDs differ")
          if manifest["beats"][0].get("trace") != "battery_trace.json":
              raise SystemExit("computed beat does not point to the shared battery trace")
          print("PASS: actual solver result is linked to Manim media and manifest")
          PY
      - name: Upload battery solver and preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/battery-solver/
            ${{ runner.temp }}/battery-solver-early/
            ${{ runner.temp }}/battery-render/

  battery-mixed-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.3'
          enable-cache: true
      - name: Install Blender system libraries and Manim requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum pkg-config libcairo2-dev libpango1.0-dev \
            libxi6 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Cache official Blender 5.2.1 runtime
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-5.2.1-linux-x64
          key: blender-5.2.1-linux-x64
      - name: Download official Blender 5.2.1
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/blender-5.2.1-linux-x64.tar.xz"
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 \
            --output "$RUNNER_TEMP/blender-5.2.1.sha256"
          expected="$(grep 'blender-5.2.1-linux-x64.tar.xz' "$RUNNER_TEMP/blender-5.2.1.sha256" | grep -Eo '[a-fA-F0-9]{64}' | head -1)"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/blender-5.2.1-linux-x64.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender-5.2.1-linux-x64.tar.xz" -C "$RUNNER_TEMP"
      - name: Install locked PyBaMM and render dependencies
        run: uv sync --locked --group sim-battery --group sim-render --no-install-project
      - name: Build validated solver context and test a Blender still frame first
        env:
          BLENDER_BIN: ${{ runner.temp }}/blender-5.2.1-linux-x64/blender
        run: |
          set -euo pipefail
          uv run --locked --no-sync python scripts/run_battery_simulation.py \
            --config examples/education/battery_spm_config.json \
            --output-dir "$RUNNER_TEMP/battery-mixed-solver" --run-id "mixed-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run --locked --no-sync python scripts/produce_lesson.py \
            --spec examples/education/battery_spm_smoke.json \
            --solver-result "$RUNNER_TEMP/battery-mixed-solver" --preview --blender-still-frame 1 \
            --output-root "$RUNNER_TEMP/battery-still" --run-id "battery-still-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="$RUNNER_TEMP/battery-still/battery-still-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -s "$run_dir/battery_still.png"
          uv run --locked --no-sync python - "$run_dir/asset_load_report.json" "$run_dir/renderer_context.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          context = json.loads(Path(sys.argv[2]).read_text())
          solver = context["solver_result"]
          if report.get("blender_version", "").split(".")[0] != "5":
              raise SystemExit("single-frame render did not use Blender major version 5")
          if report.get("selected_render_engine") != "BLENDER_EEVEE":
              raise SystemExit("Blender 5.2 did not select its supported BLENDER_EEVEE engine")
          if report.get("solver_run_id") != solver["run_id"] or report.get("solver_result_sha256") != solver["result_sha256"]:
              raise SystemExit("still-frame asset report is detached from the validated solver run")
          if report.get("still_frame") != 1:
              raise SystemExit("single-frame renderer did not report the requested frame")
          print("PASS: Blender 5.2 asset load and solver-backed still frame")
          PY
      - name: Render and validate actual PyBaMM Blender plus Manim preview
        env:
          BLENDER_BIN: ${{ runner.temp }}/blender-5.2.1-linux-x64/blender
          V11_MANIM_BIN: manim
        run: |
          set -euo pipefail
          uv run --locked --no-sync python scripts/produce_lesson.py \
            --spec examples/education/battery_spm_smoke.json \
            --solver-result "$RUNNER_TEMP/battery-mixed-solver" --preview \
            --output-root "$RUNNER_TEMP/battery-mixed" --run-id "battery-mixed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="$RUNNER_TEMP/battery-mixed/battery-mixed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$BLENDER_BIN" --version | head -1
          test -s "$run_dir/preview.mp4"
          test -s "$run_dir/li_ion_battery_blender.mp4"
          test -s "$run_dir/asset_load_report.json"
          test -s "$run_dir/subtitles.ko.vtt"
          test -s "$run_dir/subtitles.ko.srt"
          uv run --locked --no-sync python core/robotics-ai-visual-director-skill/templates/validate_visual_manifest.py \
            "$run_dir/visual_manifest.json" --require-media
          uv run --locked --no-sync python scripts/validate_delivery.py "$run_dir/preview.mp4" \
            --min-width 960 --min-height 540 --fps 30 --timeline "$run_dir/timeline.json" \
            --caption-timing "$run_dir/caption_timing.json" --full-decode
          uv run --locked --no-sync python - "$run_dir" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          run = Path(sys.argv[1])
          read = lambda name: json.loads((run / name).read_text())
          result, context = read("result.json"), read("renderer_context.json")
          asset, provenance, manifest, timeline = (read("asset_load_report.json"), read("renderer_provenance.json"),
                                                    read("visual_manifest.json"), read("timeline.json"))
          if timeline["total_frames"] != 720 or timeline["fps"] != 30:
              raise SystemExit("mixed lesson timeline is not 720 frames at 30 fps")
          solver = context["solver_result"]
          if solver["run_id"] != result["solver_execution"]["run_id"] or solver["result_sha256"] != result["result_sha256"]:
              raise SystemExit("renderer context does not reference the actual saved PyBaMM run")
          if asset["solver_run_id"] != solver["run_id"] or asset["solver_result_sha256"] != solver["result_sha256"]:
              raise SystemExit("Blender asset report does not reference the same PyBaMM result")
          if provenance["solver_provenance"]["run_id"] != solver["run_id"]:
              raise SystemExit("final renderer provenance Run ID mismatch")
          if hashlib.sha256((run / "preview.mp4").read_bytes()).hexdigest() != provenance["video_sha256"]:
              raise SystemExit("final media SHA-256 differs from renderer provenance")
          if {beat.get("tool") for beat in manifest["beats"]} != {"B", "M"}:
              raise SystemExit("mixed lesson manifest did not execute both renderer types")
          print("PASS: shared PyBaMM provenance, Blender asset load, 720-frame mixed output")
          PY
      - name: Upload mixed Blender and Manim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-mixed-preview-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/battery-mixed-solver/
            ${{ runner.temp }}/battery-mixed/
            ${{ runner.temp }}/battery-still/
