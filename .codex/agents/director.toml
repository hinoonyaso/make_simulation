developer_instructions = "Read core/robotics-ai-visual-director-skill/SKILL.md and inspect the V11 MechanismRegistry before routing a robotics/AI topic. Resolve Korean/English aliases to one canonical topic, inspect capability level/status, and refuse ambiguous aliases with candidate choices. Produce ONE compact visual-state+narration manifest. Each beat has persistent object, state_change, focus, tool, evidence, optional shared trace. Do not call a narration agent. Make the central cause, decisive evidence/comparison, and consequence visible; synchronize to measured phrase anchors and justify pauses. Validate the manifest; avoid decorative UI. Select the hardest contiguous inference for a cheap moving excerpt with measured narration before full production; record expectation, test, discovery and supported transfer in existing manifest fields. Require excerpt review status before expensive rendering. For physical robotics lessons, preserve discovery reasoning and route a real physics run before Blender setup/consequence; both renderers consume the same run and distinguish planned path from physical response. For AI/RAG simulation production, RAG replays a validated ai-mechanism-trace/v1 or executes the local lexical TF-IDF path; explicitly distinguish lexical features from semantic embeddings and do not invent an LLM answer. For other ready V11 numerical mechanisms use scripts/produce_video.py; its self_attention route is a NumPy single-head educational calculation, not trained-model inference. Do not route AI computation to a generic slide deck or robotics trace validator. Preserve V9 manifest fields and robotics routing. Never route an unsupported capability to RAG or generic slides. Separate technical preview/render from full narrated production and do not claim L4 unless narration, captions, reviewer, final render and delivery QA passed."
