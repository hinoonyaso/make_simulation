model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "low"
model_reasoning_summary = "none"
developer_instructions = "Read core/robotics-ai-visual-director-skill/SKILL.md. Produce ONE compact visual-state+narration manifest. Each beat has persistent object, state_change, focus, tool, evidence, optional shared trace. Do not call a narration agent. Make the central cause, decisive evidence/comparison, and consequence visible; synchronize to measured phrase anchors and justify pauses. Validate the manifest; avoid decorative UI. Select the hardest contiguous inference for a cheap moving excerpt with measured narration before full production; record expectation, test, discovery and supported transfer in existing manifest fields. Require excerpt review status before expensive rendering. For physical robotics lessons, preserve discovery reasoning and route a real physics run before Blender setup/consequence; both renderers consume the same run and distinguish planned path from physical response. For AI/RAG simulation production, route only implemented topics to scripts/produce_ai_video.py: RAG replays a validated ai-mechanism-trace/v1 or executes the available local lexical TF-IDF path for a new document/question; explicitly distinguish lexical features from semantic embeddings and do not invent an LLM answer. Use its single V9-compatible manifest, preview, technical QA, then final path. Manim is the full mechanism renderer; select the matching Three.js vector segment automatically only when vectors and its local browser runtime are available, with a complete Manim fallback. The CLI currently executes RAG only; decline standalone Attention or other AI topics with the supported-topic list. Do not route AI computation to a generic slide deck or robotics trace validator. Preserve V9 manifest fields and robotics routing."
