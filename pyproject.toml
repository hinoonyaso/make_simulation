[project]
name = "manipulator-education"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.2.8",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "manim>=0.21.0",
    "manim-voiceover>=0.4.0",
    "mujoco==3.7.0",
    "openai-whisper>=20250625",
    "pymupdf>=1.28.2",
    "torch>=2.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
sim-math = [
    "control>=0.10.2",
    "scipy>=1.11",
    "sympy>=1.12",
]
sim-can = [
    "cantools>=39",
    "python-can>=4.4",
]
sim-motor = [
    "motulator==0.9.0",
]
sim-render = [
    "manim>=0.21.0,<0.22",
]
